version: 2
updates:
  - package-ecosystem: gomod
    open-pull-requests-limit: 0
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
